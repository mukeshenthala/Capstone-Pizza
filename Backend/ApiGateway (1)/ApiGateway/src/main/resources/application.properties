spring.application.name=API-GATEWAY

server.port=9090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=admin-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ADMIN-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/admin/**

spring.cloud.gateway.server.webmvc.routes[2].id=notification-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/notifications/**